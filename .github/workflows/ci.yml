name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      # Terms that must never be published live in a repository secret, not in the repo.
      # Skipped automatically on forks, where the secret is empty.
      - name: Internal terms
        env:
          WHATSLOADED_TERMS: ${{ secrets.WHATSLOADED_TERMS }}
        run: node scripts/check-terms.mjs
