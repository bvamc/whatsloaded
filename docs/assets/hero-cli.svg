<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12.2px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect width="1200" height="470" rx="12" fill="#0c0c0f" stroke="#25252c" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="34" rx="11" fill="#141418"/>
  <line x1="0" y1="35" x2="1200" y2="35" stroke="#25252c" stroke-width="1"/>
  <circle cx="20" cy="18" r="5.5" fill="#ef6b5a" fill-opacity="0.85"/>
  <circle cx="38" cy="18" r="5.5" fill="#f2a93b" fill-opacity="0.85"/>
  <circle cx="56" cy="18" r="5.5" fill="#93d48c" fill-opacity="0.85"/>
  <text x="600" y="22" text-anchor="middle" class="title" fill="#8a887f">whatsloaded — terminal (zsh)</text>

  <!-- Vertical Divider for Split Pane -->
  <line x1="590" y1="35" x2="590" y2="470" stroke="#1b1b20" stroke-width="1.5"/>

  <!-- LEFT PANE: matrix & doctor -->
  <g transform="translate(24, 62)" class="mono">
    <text x="0" y="0" fill="#f2a93b">❯ <tspan fill="#ecebe4" font-weight="600">whatsloaded matrix</tspan></text>
    <text x="0" y="24" fill="#5f5e58">NAME                  claude   kiro    codex   opencode</text>
    <text x="0" y="44" fill="#ecebe4">github                <tspan fill="#93d48c">u p</tspan>      <tspan fill="#93d48c">u a</tspan>     <tspan fill="#f2a93b">u</tspan>       <tspan fill="#5f5e58">·</tspan></text>
    <text x="0" y="64" fill="#ecebe4">playwright            <tspan fill="#93d48c">u</tspan>        <tspan fill="#5f5e58">·</tspan>       <tspan fill="#93d48c">u</tspan>       <tspan fill="#93d48c">u</tspan></text>
    <text x="0" y="84" fill="#ecebe4">postgres-mcp          <tspan fill="#93d48c">l</tspan>        <tspan fill="#5f5e58">·</tspan>       <tspan fill="#5f5e58">·</tspan>       <tspan fill="#5f5e58">·</tspan></text>
    <text x="0" y="104" fill="#ecebe4">sentry                <tspan fill="#74d4d2">pl</tspan>       <tspan fill="#93d48c">u</tspan>       <tspan fill="#5f5e58">·</tspan>       <tspan fill="#5f5e58">·</tspan></text>
    <text x="0" y="124" fill="#ecebe4">linear                <tspan fill="#5f5e58">-u</tspan>       <tspan fill="#93d48c">a</tspan>       <tspan fill="#5f5e58">·</tspan>       <tspan fill="#5f5e58">·</tspan></text>
    <text x="0" y="148" fill="#5f5e58">u=user p=project l=local a=agent pl=plugin · green=on -=off</text>

    <!-- Doctor Output -->
    <text x="0" y="190" fill="#f2a93b">❯ <tspan fill="#ecebe4" font-weight="600">whatsloaded doctor</tspan></text>

    <text x="0" y="216" fill="#ef6b5a">error <tspan fill="#bdbbb1">runtime-not-found</tspan></text>
    <text x="16" y="236" fill="#8a887f">postgres-mcp: `pg-mcp-server` is not installed on PATH</text>

    <text x="0" y="264" fill="#f2a93b">warn  <tspan fill="#bdbbb1">mcp-drift</tspan></text>
    <text x="16" y="284" fill="#8a887f">github: your 3 configurations launch it 2 different ways</text>
    <text x="16" y="302" fill="#5f5e58">(claude user + kiro user vs codex user). See: whatsloaded where github</text>

    <text x="0" y="330" fill="#f2a93b">warn  <tspan fill="#bdbbb1">reference-unconfigured</tspan></text>
    <text x="16" y="350" fill="#8a887f">1 claude agent uses `jira` tools (mcp__jira__search),</text>
    <text x="16" y="368" fill="#5f5e58">but no claude configuration named `jira` exists: pr-triager</text>

    <text x="0" y="396" fill="#74d4d2">info  <tspan fill="#bdbbb1">unshared-skill</tspan></text>
    <text x="16" y="414" fill="#8a887f">commit-style exists as 2 standalone copies; share via `whatsloaded adopt`</text>
  </g>

  <!-- RIGHT PANE: where & measure -->
  <g transform="translate(614, 62)" class="mono">
    <text x="0" y="0" fill="#f2a93b">❯ <tspan fill="#ecebe4" font-weight="600">whatsloaded where github</tspan></text>
    <text x="0" y="22" fill="#ecebe4" font-weight="600">github</text>
    <text x="0" y="40" fill="#8a887f">  1 install · 4 configurations (3 yours · 1 agent profile) · used by 2 agents</text>

    <text x="0" y="66" fill="#74d4d2">Installed</text>
    <text x="0" y="84" fill="#93d48c">  ● <tspan fill="#ecebe4">/opt/homebrew/bin/npx</tspan> <tspan fill="#5f5e58">(4 configurations)</tspan></text>

    <text x="0" y="110" fill="#74d4d2">Configured</text>
    <text x="0" y="128" fill="#bdbbb1">  yours (3)</text>
    <text x="0" y="146" fill="#8a887f">    claude user        <tspan fill="#93d48c">on</tspan>   ~/.claude.json</text>
    <text x="0" y="164" fill="#8a887f">    kiro user          <tspan fill="#93d48c">on</tspan>   ~/.kiro/settings/mcp.json</text>
    <text x="0" y="182" fill="#8a887f">    codex user         <tspan fill="#f2a93b">on</tspan>   ~/.codex/config.toml</text>
    <text x="0" y="200" fill="#bdbbb1">  agent profiles (1)</text>
    <text x="0" y="218" fill="#8a887f">    kiro agent@reviewer <tspan fill="#93d48c">on</tspan>  ~/.kiro/agents/reviewer.json</text>

    <text x="0" y="244" fill="#74d4d2">Variants (your configurations only)</text>
    <text x="0" y="262" fill="#93d48c">  A ×2  <tspan fill="#ecebe4">npx -y @modelcontextprotocol/server-github</tspan></text>
    <text x="0" y="280" fill="#f2a93b">  B ×1  <tspan fill="#ecebe4">npx -y @modelcontextprotocol/server-github --read-only</tspan></text>

    <!-- Measure Output -->
    <text x="0" y="318" fill="#f2a93b">❯ <tspan fill="#ecebe4" font-weight="600">whatsloaded measure github -y</tspan></text>
    <text x="0" y="340" fill="#93d48c">✓ <tspan fill="#ecebe4">github</tspan> <tspan fill="#8a887f">(claude:user)</tspan></text>
    <text x="0" y="360" fill="#bdbbb1">  26 tools exposed · <tspan fill="#f2a93b" font-weight="600">≈ 5,410 tokens</tspan> in context before your first message</text>
    <text x="0" y="380" fill="#5f5e58">  largest schemas: create_or_update_file (410 tok), search_code (380 tok)</text>
    <text x="0" y="400" fill="#5f5e58">  cached in ~/.whatsloaded/cache/tools/ (names &amp; byte sizes only)</text>
  </g>
</svg>