      <rect x="16" y="60" width="408" height="136" rx="8" fill="#08080a" stroke="#25252c" stroke-width="1"/>
      <text x="26" y="80" class="mono" font-size="10.5" fill="#5f5e58">~/.codex/config.toml (comments &amp; key order preserved)</text>
      <text x="26" y="100" class="mono" font-size="11" fill="#bdbbb1"> [mcp_servers.github]</text>
      <text x="26" y="118" class="mono" font-size="11" fill="#bdbbb1"> command = "npx"</text>
      <rect x="20" y="124" width="396" height="18" fill="#ef6b5a" fill-opacity="0.14"/>
      <text x="26" y="137" class="mono" font-size="11" fill="#ef6b5a">-args = ["-y", "@modelcontextprotocol/server-github", "--old"]</text>
      <rect x="20" y="142" width="396" height="18" fill="#93d48c" fill-opacity="0.14"/>
      <text x="26" y="155" class="mono" font-size="11" fill="#93d48c">+args = ["-y", "@modelcontextprotocol/server-github"]</text>
      <text x="26" y="174" class="mono" font-size="11" fill="#5f5e58"> # Personal token (redacted in UI)</text>
      <text x="26" y="190" class="mono" font-size="11" fill="#bdbbb1"> env = { GITHUB_TOKEN = "••••••••" }</text>

      <!-- Modal Footer Buttons -->
      <text x="20" y="232" class="sans" font-size="11.5" fill="#8a887f"> Automatic backup in ~/.whatsloaded/backups/</text>
      <rect x="252" y="212" width="70" height="32" rx="6" fill="#1b1b20"/>
      <text x="287" y="232" text-anchor="middle" class="sans" font-size="12" fill="#bdbbb1">Cancel</text>
