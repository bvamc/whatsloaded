      <circle cx="24" cy="26" r="4.5" fill="#dcd8cc"/>
      <text x="36" y="30" class="sans" font-size="14" font-weight="600" fill="#ecebe4">Codex</text>
      <rect x="314" y="14" width="108" height="24" rx="5" fill="#1b1b20"/>
