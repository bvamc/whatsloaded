      <text x="20" y="72" class="serif" font-size="28" fill="#ecebe4"><tspan fill="#f2a93b">9</tspan> MCP servers start</text>
      <text x="20" y="94" class="sans" font-size="13" fill="#bdbbb1">18 skills · 12 subagents · 4 commands · 4 rules</text>
      <text x="20" y="114" class="sans" font-size="12" fill="#5f5e58">≈ 24.8k tokens before your first message (incl. measured tool schemas)</text>

      <text x="20" y="142" class="sans" font-size="12.5" fill="#ecebe4">
        Last 30 days: you used <tspan fill="#93d48c" font-weight="500">3 of 9 servers</tspan> · <tspan fill="#93d48c" font-weight="500">5 of 18 skills</tspan>
      </text>
      <text x="20" y="162" class="sans" font-size="12.5" fill="#f2a93b">Trim what you have not used: 6 servers, ≈ 14.2k tokens →</text>

      <line x1="20" y1="178" x2="420" y2="178" stroke="#1b1b20" stroke-width="1"/>
      <text x="20" y="198" class="sans" font-size="12" fill="#8a887f">2 plugins add to this. Largest: <tspan class="mono" fill="#bdbbb1">devops-kit@market</tspan> (≈ 6.4k tokens)</text>
      <text x="20" y="218" class="sans" font-size="12" fill="#ef6b5a">▲ 2 problems you can fix (1 drift, 1 missing binary)</text>
    </g>

