      <text x="165" y="84" class="mono" font-size="11.5" fill="#8a887f">github: claude user vs codex user</text>
      <line x1="0" y1="98" x2="440" y2="98" stroke="#1b1b20" stroke-width="1"/>

      <circle cx="18" cy="118" r="4" fill="#f2a93b"/>
