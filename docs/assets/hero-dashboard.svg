      <text x="20" y="94" class="sans" font-size="13" fill="#bdbbb1">11 skills · 2 rules</text>
      <text x="20" y="114" class="sans" font-size="12" fill="#5f5e58">≈ 9.4k tokens of instructions + tool definitions</text>

      <text x="20" y="142" class="sans" font-size="12.5" fill="#8a887f">
        Shared skill store: <tspan class="mono" fill="#74d4d2">9 linked</tspan> from ~/.agents/skills
      </text>
      <text x="20" y="162" class="sans" font-size="12.5" fill="#f2a93b">⊕ github starts 2 times (user + project scope)</text>

      <line x1="20" y1="178" x2="420" y2="178" stroke="#1b1b20" stroke-width="1"/>
      <text x="20" y="198" class="sans" font-size="12" fill="#8a887f">Active profile: <tspan class="mono" fill="#93d48c">backend-lean</tspan> (saved 2d ago)</text>
      <text x="20" y="218" class="sans" font-size="12" fill="#ef6b5a">▲ 1 problem you can fix (mcp-drift on github)</text>
    </g>

