      <text x="215" y="60" class="sans" font-size="12.5" fill="#8a887f">· 8 skills · 4 steering · 3 agents</text>
      <text x="20" y="86" class="sans" font-size="12" fill="#5f5e58">≈ 11.6k tokens · 2 agent-scoped servers embedded in reviewer.json</text>
      <text x="20" y="108" class="sans" font-size="12" fill="#ef6b5a">▲ 1 problem: agent @reviewer references unconfigured server `Linear`</text>
