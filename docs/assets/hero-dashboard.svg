    <!-- Problems to Fix Panel (Bottom Left) -->
    <g transform="translate(0, 426)">
      <text x="2" y="12" class="sans" font-size="10" font-weight="600" fill="#5f5e58" letter-spacing="1.8">PROBLEMS YOU CAN FIX (4)</text>
      <rect x="0" y="22" width="440" height="118" rx="10" fill="#0e0e11" stroke="#25252c" stroke-width="1"/>
      
      <circle cx="18" cy="44" r="4" fill="#ef6b5a"/>
      <text x="32" y="48" class="sans" font-size="12" font-weight="500" fill="#ecebe4">Command not found</text>
      <text x="165" y="48" class="mono" font-size="11.5" fill="#8a887f">postgres-mcp: binary not on PATH</text>
      <line x1="0" y1="61" x2="440" y2="61" stroke="#1b1b20" stroke-width="1"/>

      <circle cx="18" cy="80" r="4" fill="#f2a93b"/>
