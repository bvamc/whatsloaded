      <rect width="440" height="236" rx="14" fill="#0e0e11" fill-opacity="0.85" stroke="#25252c" stroke-width="1"/>
      <rect x="20" y="0" width="400" height="1.5" fill="url(#claudeLine)"/>
      <circle cx="24" cy="26" r="4.5" fill="#e07a57"/>
